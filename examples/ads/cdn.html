<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>프리롤 광고 — CDN에서 받는 플레이어</title>
    <link rel="stylesheet" href="./dist/video-ads.css" />
    <link rel="stylesheet" href="./style.css" />

    <!-- 플레이어는 공개 CDN에서 받고, 광고 코드만 로컬입니다.
         @videojs/ads는 배포된 패키지가 아니기 때문입니다. -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/html/cdn/video.js"></script>
    <script type="module" src="./dist/videojs-ads.js"></script>
  </head>
  <body>
    <main>
      <h1>CDN에서 받는 플레이어</h1>

      <video-player>
        <video-skin>
          <video src="https://stream.mux.com/lhnU49l1VGi3zrTAZhDm9LUUxSjpaPW9BL4jY25Kwo4/highest.mp4" playsinline crossorigin="anonymous"></video>
          <media-ads src="./ads.json"></media-ads>
        </video-skin>
      </video-player>

      <div class="meta">
        <span class="tag">jsdelivr @videojs/html + ./dist/videojs-ads.js</span>
      </div>

      <nav><a href="./">← 세 가지 방식 전체</a></nav>
    </main>
  </body>
</html>
