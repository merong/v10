<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video.js 10 — preroll ad example</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
        color: #eee;
        font-family: system-ui, sans-serif;
      }

      main {
        width: min(90vw, 720px);
      }

      /* The ads overlay is absolutely positioned, so its container must establish
         a positioning context. Wrap only the player, not the surrounding copy. */
      .player {
        position: relative;
      }

      /* The skin fills its container, so give it a size. Without one it collapses. */
      video-skin {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
      }

      p {
        margin: 1rem 0 0;
        font-size: 0.875rem;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <main>
      <!--
        The player and the ads overlay ship in one bundle, so this is the only
        element setup the page needs. No init call, no options object.
      -->
      <div class="player">
        <video-player>
          <video-skin>
            <video
              src="https://stream.mux.com/lhnU49l1VGi3zrTAZhDm9LUUxSjpaPW9BL4jY25Kwo4/highest.mp4"
              playsinline
              crossorigin="anonymous"
            ></video>
          </video-skin>
        </video-player>
      </div>

      <p>Press play. A 10-second ad runs first and becomes skippable after 3 seconds.</p>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
